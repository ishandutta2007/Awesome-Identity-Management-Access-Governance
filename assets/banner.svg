<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 420" width="100%" height="100%">
  <defs>
    <!-- Background Gradients -->
    <linearGradient id="bg-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0a0f1d" />
      <stop offset="50%" stop-color="#0f172a" />
      <stop offset="100%" stop-color="#020617" />
    </linearGradient>
    
    <linearGradient id="cyan-indigo" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#38bdf8" />
      <stop offset="50%" stop-color="#818cf8" />
      <stop offset="100%" stop-color="#c084fc" />
    </linearGradient>

    <linearGradient id="shield-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38bdf8" stop-opacity="0.8" />
      <stop offset="100%" stop-color="#6366f1" stop-opacity="0.3" />
    </linearGradient>

    <linearGradient id="card-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1e293b" stop-opacity="0.75" />
      <stop offset="100%" stop-color="#0f172a" stop-opacity="0.85" />
    </linearGradient>

    <!-- Filters for Glow -->
    <filter id="glow-cyan" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="8" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>

    <filter id="glow-orb" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="40" result="blur" />
    </filter>

    <!-- Grid Pattern -->
    <pattern id="cyber-grid" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M 40 0 L 0 0 0 40" fill="none" stroke="#334155" stroke-width="0.75" stroke-opacity="0.25" />
      <circle cx="40" cy="40" r="1.5" fill="#38bdf8" fill-opacity="0.2" />
    </pattern>

    <!-- Keyframe Animations -->
    <style>
      .orb-1 {
        animation: floatOrb1 14s ease-in-out infinite alternate;
      }
      .orb-2 {
        animation: floatOrb2 18s ease-in-out infinite alternate;
      }
      .stream-line {
        stroke-dasharray: 8 16;
        animation: streamPulse 3s linear infinite;
      }
      .pulse-node {
        animation: pulseNode 3s ease-in-out infinite;
      }
      .rotate-ring {
        transform-origin: 1040px 210px;
        animation: spinRing 25s linear infinite;
      }
      .rotate-ring-reverse {
        transform-origin: 1040px 210px;
        animation: spinRingRev 35s linear infinite;
      }
      .pill-float {
        animation: pillFloat 4s ease-in-out infinite alternate;
      }
      .pill-float-delayed {
        animation: pillFloat 4s ease-in-out 2s infinite alternate;
      }

      @keyframes streamPulse {
        0% { stroke-dashoffset: 48; }
        100% { stroke-dashoffset: 0; }
      }
      @keyframes floatOrb1 {
        0% { transform: translate(0px, 0px) scale(1); }
        100% { transform: translate(80px, 40px) scale(1.15); }
      }
      @keyframes floatOrb2 {
        0% { transform: translate(0px, 0px) scale(1); }
        100% { transform: translate(-70px, -50px) scale(1.2); }
      }
      @keyframes pulseNode {
        0%, 100% { r: 5px; opacity: 0.6; }
        50% { r: 8px; opacity: 1; }
      }
      @keyframes spinRing {
        0% { transform: rotate(0deg); }
        100% { transform: rotate(360deg); }
      }
      @keyframes spinRingRev {
        0% { transform: rotate(360deg); }
        100% { transform: rotate(0deg); }
      }
      @keyframes pillFloat {
        0% { transform: translateY(0px); }
        100% { transform: translateY(-6px); }
      }
    </style>
  </defs>

  <!-- Background Base -->
  <rect width="1200" height="420" fill="url(#bg-grad)" rx="16" />

  <!-- Animated Glowing Orbs (Behind Everything) -->
  <g filter="url(#glow-orb)">
    <circle class="orb-1" cx="220" cy="140" r="160" fill="#0284c7" opacity="0.22" />
    <circle class="orb-2" cx="1000" cy="280" r="180" fill="#6366f1" opacity="0.25" />
    <circle class="orb-1" cx="600" cy="360" r="140" fill="#a855f7" opacity="0.15" />
  </g>

  <!-- Cyber Grid Pattern Overlay -->
  <rect width="1200" height="420" fill="url(#cyber-grid)" rx="16" />

  <!-- Dynamic Security Architecture Graphic (Right side) -->
  <g transform="translate(0, 0)">
    <!-- Circuit lines connecting governance nodes -->
    <path class="stream-line" d="M 880 210 L 960 210 L 1040 130" stroke="#38bdf8" stroke-width="2" fill="none" opacity="0.6" />
    <path class="stream-line" d="M 960 210 L 1040 290" stroke="#818cf8" stroke-width="2" fill="none" opacity="0.6" />
    <path class="stream-line" d="M 1040 130 L 1120 210 L 1040 290" stroke="#c084fc" stroke-width="2" fill="none" opacity="0.5" />

    <!-- Outer Rotating Security Ring -->
    <circle class="rotate-ring" cx="1040" cy="210" r="110" fill="none" stroke="#38bdf8" stroke-width="1.5" stroke-dasharray="16 28 8 20" opacity="0.45" />
    <circle class="rotate-ring-reverse" cx="1040" cy="210" r="85" fill="none" stroke="#818cf8" stroke-width="1.5" stroke-dasharray="24 16 12 12" opacity="0.5" />

    <!-- Central Governance Core Shield Icon -->
    <g transform="translate(1040, 210)">
      <circle cx="0" cy="0" r="54" fill="url(#card-grad)" stroke="#38bdf8" stroke-width="2" filter="url(#glow-cyan)" />
      <!-- Stylized Shield & Keyhole -->
      <path d="M 0 -26 L 22 -16 C 22 10 12 24 0 30 C -12 24 -22 10 -22 -16 Z" fill="url(#shield-grad)" stroke="#bae6fd" stroke-width="1.5" />
      <circle cx="0" cy="-2" r="5" fill="#ffffff" />
      <path d="M -2.5 -2 L 2.5 -2 L 4 12 L -4 12 Z" fill="#ffffff" />
    </g>

    <!-- Governance Diagram Nodes -->
    <circle class="pulse-node" cx="880" cy="210" r="6" fill="#38bdf8" filter="url(#glow-cyan)" />
    <text x="880" y="235" fill="#94a3b8" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="11" text-anchor="middle" font-weight="600">Identity Ingestion</text>

    <circle class="pulse-node" cx="1040" cy="115" r="6" fill="#818cf8" filter="url(#glow-cyan)" />
    <text x="1040" y="98" fill="#94a3b8" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="11" text-anchor="middle" font-weight="600">Policy &amp; SoD</text>

    <circle class="pulse-node" cx="1040" cy="305" r="6" fill="#c084fc" filter="url(#glow-cyan)" />
    <text x="1040" y="328" fill="#94a3b8" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="11" text-anchor="middle" font-weight="600">Certifications</text>

    <circle class="pulse-node" cx="1135" cy="210" r="6" fill="#34d399" filter="url(#glow-cyan)" />
    <text x="1135" y="235" fill="#94a3b8" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="11" text-anchor="middle" font-weight="600">Provisioning</text>
  </g>

  <!-- Left Content Area (Always in crisp Foreground) -->
  <g transform="translate(70, 70)">
    <!-- Top Pill Badge -->
    <g class="pill-float">
      <rect x="0" y="0" width="220" height="28" rx="14" fill="#1e293b" stroke="#38bdf8" stroke-width="1.2" opacity="0.9" />
      <circle cx="14" cy="14" r="5" fill="#38bdf8" filter="url(#glow-cyan)" />
      <text x="28" y="18" fill="#e2e8f0" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="12" font-weight="600" letter-spacing="0.5">CURATED AWESOME LIST</text>
    </g>

    <!-- Main Title -->
    <text x="0" y="78" fill="#ffffff" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Inter, sans-serif" font-size="38" font-weight="800" letter-spacing="-0.5">
      Identity Management &amp;
    </text>
    <text x="0" y="125" fill="url(#cyan-indigo)" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Inter, sans-serif" font-size="38" font-weight="800" letter-spacing="-0.5">
      Access Governance (IGA)
    </text>

    <!-- Subtitle / Tagline -->
    <text x="0" y="165" fill="#94a3b8" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="15" font-weight="400">
      The authoritative guide to Enterprise SaaS Platforms &amp; Open-Source Projects
    </text>
    <text x="0" y="188" fill="#64748b" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="13" font-weight="400">
      Lifecycle Workflows • Role Mining • Entitlements • SoD Enforcement • Compliance
    </text>

    <!-- Dynamic Feature Interactive Pills -->
    <g transform="translate(0, 222)">
      <!-- Pill 1 -->
      <g class="pill-float" transform="translate(0, 0)">
        <rect width="135" height="34" rx="8" fill="#1e293b" stroke="#475569" stroke-width="1" />
        <text x="67" y="21" fill="#38bdf8" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="12" font-weight="600" text-anchor="middle">🛡️ Zero Trust</text>
      </g>
      <!-- Pill 2 -->
      <g class="pill-float-delayed" transform="translate(145, 0)">
        <rect width="145" height="34" rx="8" fill="#1e293b" stroke="#475569" stroke-width="1" />
        <text x="72" y="21" fill="#818cf8" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="12" font-weight="600" text-anchor="middle">⚡ Access Reviews</text>
      </g>
      <!-- Pill 3 -->
      <g class="pill-float" transform="translate(300, 0)">
        <rect width="140" height="34" rx="8" fill="#1e293b" stroke="#475569" stroke-width="1" />
        <text x="70" y="21" fill="#c084fc" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="12" font-weight="600" text-anchor="middle">🌐 Cloud Identity</text>
      </g>
      <!-- Pill 4 -->
      <g class="pill-float-delayed" transform="translate(450, 0)">
        <rect width="150" height="34" rx="8" fill="#1e293b" stroke="#475569" stroke-width="1" />
        <text x="75" y="21" fill="#34d399" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="12" font-weight="600" text-anchor="middle">🔓 Open-Source IGA</text>
      </g>
    </g>
  </g>

  <!-- Top Accent Border -->
  <rect x="0" y="0" width="1200" height="3" fill="url(#cyan-indigo)" rx="1.5" />
</svg>
